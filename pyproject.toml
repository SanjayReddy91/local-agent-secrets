[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-agent-vault"
version = "0.1.0"
description = "Local-only credential broker for MCP agents"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "httpx>=0.28,<0.29",
    "mcp>=1.20,<2",
    "pykeepass>=4.1,<5",
]

[project.scripts]
local-vault = "local_agent_vault.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_agent_vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
